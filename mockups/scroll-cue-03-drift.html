<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mockup 03 — The Counter-Drift</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap" rel="stylesheet" />
<style>
  :root { --bg: #000000; --fg: #ffffff; --muted: rgba(255,255,255,0.5); --line: rgba(255,255,255,0.85); }
  [data-theme="light"] { --bg: #f2ecdf; --fg: #000000; --muted: rgba(0,0,0,0.5); --line: rgba(0,0,0,0.85); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); font-family: "Bricolage Grotesque", system-ui, sans-serif; min-height: 100vh; overflow: hidden; transition: background 0.4s ease, color 0.4s ease; }
  .tag { position: fixed; top: 14px; left: 16px; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); z-index: 10; }
  .theme { position: fixed; top: 14px; right: 16px; z-index: 10; display: flex; gap: 5px; background: transparent; border: 1px solid var(--muted); border-radius: 999px; padding: 4px; cursor: pointer; }
  .theme span { width: 16px; height: 16px; border-radius: 50%; background: var(--fg); }
  .theme .dot-beige { background: #f2ecdf; }
  .theme .dot-black { background: #000; }
  main { height: 100vh; display: flex; flex-direction: column; }
  .stage { flex: 1; display: grid; place-items: center; padding: 0 24px; }
  h1 { font-size: clamp(2.75rem, 11vw, 10rem); font-weight: 800; text-transform: uppercase; letter-spacing: -0.04em; line-height: 0.95; text-align: center; }

  .cue { position: absolute; left: 50%; bottom: 44px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; height: 96px; justify-content: flex-end; }
  .cue .label { font-size: 11px; font-weight: 500; letter-spacing: 0.3em; text-transform: uppercase; color: var(--muted); animation: rise 6s ease-in-out infinite; }
  .cue .thread { width: 1px; height: 64px; background: linear-gradient(180deg, transparent, var(--line), transparent); animation: thread 6s ease-in-out infinite; }
  @keyframes rise { 0%, 100% { transform: translateY(0); opacity: 0.55; } 50% { transform: translateY(-18px); opacity: 1; } }
  @keyframes thread { 0%, 100% { transform: translateY(-10px); opacity: 0.4; } 50% { transform: translateY(10px); opacity: 0.9; } }
  @media (prefers-reduced-motion: reduce) { .label, .thread { animation: none; } }
</style>
</head>
<body>
  <div class="tag">MOCKUP 03 · the counter-drift · delete me</div>
  <button class="theme" onclick="document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'" aria-label="Toggle theme"><span class="dot-black"></span><span class="dot-beige"></span></button>
  <main>
    <div class="stage"><h1>AADESH KHANDE</h1></div>
    <div class="cue" aria-hidden="true"><span class="label">Scroll</span><span class="thread"></span></div>
  </main>
</body>
</html>
