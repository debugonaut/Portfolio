<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Scroll Cue Mockups — all four</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap" rel="stylesheet" />
<style>
  :root { --bg: #000000; --fg: #ffffff; --muted: rgba(255,255,255,0.5); --line: rgba(255,255,255,0.85); --ring: rgba(255,255,255,0.75); --trail: rgba(255,255,255,0.4); }
  [data-theme="light"] { --bg: #f2ecdf; --fg: #000000; --muted: rgba(0,0,0,0.5); --line: rgba(0,0,0,0.85); --ring: rgba(0,0,0,0.75); --trail: rgba(0,0,0,0.35); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); font-family: "Bricolage Grotesque", system-ui, sans-serif; transition: background 0.4s ease, color 0.4s ease; }
  .bar { position: fixed; inset: 0 0 auto 0; z-index: 50; display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; background: color-mix(in srgb, var(--bg) 80%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--muted); }
  .bar .t { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .theme { display: flex; gap: 5px; background: transparent; border: 1px solid var(--muted); border-radius: 999px; padding: 4px; cursor: pointer; }
  .theme span { width: 16px; height: 16px; border-radius: 50%; background: var(--fg); }
  .theme .dot-beige { background: #f2ecdf; }
  .theme .dot-black { background: #000; }
  .scene { position: relative; height: 100vh; display: flex; flex-direction: column; border-bottom: 1px solid var(--muted); }
  .stage { flex: 1; display: grid; place-items: center; padding: 0 24px; }
  h1 { font-size: clamp(2.75rem, 11vw, 10rem); font-weight: 800; text-transform: uppercase; letter-spacing: -0.04em; line-height: 0.95; text-align: center; }
  .cap { position: absolute; top: 84px; left: 50%; transform: translateX(-50%); font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .cue { position: absolute; left: 50%; bottom: 44px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .cue .label { font-size: 11px; font-weight: 500; letter-spacing: 0.3em; text-transform: uppercase; color: var(--muted); }

  /* 00 — baseline: static line */
  .cue-00 .line { width: 1px; height: 44px; background: linear-gradient(180deg, var(--line), transparent); }

  /* 01 — falling mote */
  .mote-well { position: relative; width: 2px; height: 64px; }
  .mote { position: absolute; left: 50%; top: 0; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: var(--mote, var(--fg)); filter: blur(0.2px); box-shadow: 0 0 12px 1px var(--trail); animation: fall 4s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite; }
  .mote::after { content: ""; position: absolute; top: 4px; left: 50%; width: 1px; height: 46px; transform: translateX(-50%); background: linear-gradient(180deg, var(--trail), transparent 70%); opacity: 0.85; }
  @keyframes fall { 0% { transform: translate(0,0) scale(0.6); opacity: 0; } 12% { opacity: 1; } 30% { transform: translate(2px,18px) scale(1); } 55% { transform: translate(-2px,36px) scale(1); } 78% { transform: translate(1.5px,54px) scale(0.9); opacity: 0.9; } 100% { transform: translate(0,64px) scale(0.5); opacity: 0; } }

  /* 02 — signal ring */
  .radar { position: relative; width: 64px; height: 64px; }
  .radar .ring { position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px; border: 1px solid var(--ring); border-radius: 50%; opacity: 0; }
  .radar .ring:nth-child(1) { animation: ping 3s cubic-bezier(0.2,0.6,0.35,1) infinite; }
  .radar .ring:nth-child(2) { animation: ping 3s cubic-bezier(0.2,0.6,0.35,1) 1.5s infinite; }
  @keyframes ping { 0% { transform: translate(0,0) scale(1); opacity: 0.7; } 100% { transform: translate(0,0) scale(7); opacity: 0; } }

  /* 03 — counter-drift */
  .cue-03 { height: 96px; justify-content: flex-end; }
  .cue-03 .label { animation: rise 6s ease-in-out infinite; }
  .cue-03 .thread { width: 1px; height: 64px; background: linear-gradient(180deg, transparent, var(--line), transparent); animation: thread 6s ease-in-out infinite; }
  @keyframes rise { 0%,100% { transform: translateY(0); opacity: 0.55; } 50% { transform: translateY(-18px); opacity: 1; } }
  @keyframes thread { 0%,100% { transform: translateY(-10px); opacity: 0.4; } 50% { transform: translateY(10px); opacity: 0.9; } }

  @media (prefers-reduced-motion: reduce) { .mote, .ring, .cue-03 .label, .cue-03 .thread { animation: none !important; } .mote { opacity: 0.7; } .ring { opacity: 0.35; transform: scale(3); } }
</style>
</head>
<body>
  <div class="bar">
    <span class="t">Scroll cue mockups — 4 options · standalone · delete me</span>
    <button class="theme" onclick="document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'" aria-label="Toggle theme"><span class="dot-black"></span><span class="dot-beige"></span></button>
  </div>

  <section class="scene">
    <div class="cap">00 · current baseline</div>
    <div class="stage"><h1>AADESH KHANDE</h1></div>
    <div class="cue cue-00" aria-hidden="true"><span class="label">Scroll down</span><span class="line"></span></div>
  </section>

  <section class="scene">
    <div class="cap">01 · the falling mote</div>
    <div class="stage"><h1>AADESH KHANDE</h1></div>
    <div class="cue" aria-hidden="true"><span class="label">Scroll</span><span class="mote-well"><span class="mote"></span></span></div>
  </section>

  <section class="scene">
    <div class="cap">02 · the signal ring</div>
    <div class="stage"><h1>AADESH KHANDE</h1></div>
    <div class="cue" aria-hidden="true"><span class="label">Scroll</span><span class="radar"><span class="ring"></span><span class="ring"></span></span></div>
  </section>

  <section class="scene">
    <div class="cap">03 · the counter-drift</div>
    <div class="stage"><h1>AADESH KHANDE</h1></div>
    <div class="cue cue-03" aria-hidden="true"><span class="label">Scroll</span><span class="thread"></span></div>
  </section>
</body>
</html>
