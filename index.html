        <script>
      // Apply the saved theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem("ak-theme");
          document.documentElement.classList.toggle("dark", t ? t === "dark" : true);
        } catch (e) {}
      })();
    </script>
